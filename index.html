  <style>
:root {

  --primary-light: #7C3AED;

  --hard: #6D28D9;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;

}

.sr-only {

}
.site-tabs {

}
.site-tabs a {

.intro {

}
.week-more summary {

}

.day { cursor: pointer; -webkit-tap-highlight-color: transparent; }

}

.headline {

}
.day-detail { padding-bottom: 8px; }

.week-intro {

}

.bar { height: 5px; background: #E2E8F0; border-radius: 99px; overflow: hidden; margin-top: 12px; }
.bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4ECDC4, #22C55E); border-radius: 99px; }

.day-rest { border-left-color: var(--rest); background: #F8FAFC; }
.day-easy { border-left-color: var(--easy); }
.day-hard { border-left-color: var(--hard); }
.day-moderate { border-left-color: var(--moderate); }
.day-race { border-left-color: var(--race); background: #FFFBFB; }
.day.today { box-shadow: 0 0 0 2px #3B82F6, 0 8px 22px rgba(59,130,246,0.14); }
.day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 0 12px; }
.day-head > div:first-child { min-width: 0; flex: 1; }
.day-head h3 { margin: 0; font-size: 1.02rem; }
.day-head h3 span { font-weight: 600; color: var(--text-muted); }
.duration { margin: 4px 0 0; font-size: 0.88rem; font-weight: 700; color: var(--primary); line-height: 1.35; }
.k { display: block; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
.day-actions { display: flex; gap: 8px; padding: 0 12px 12px; }
.done-btn, .log-btn, .note-clear, .btn {

}
.done-btn, .log-btn { flex: 1; }

}
.badge-rest { background: #E2E8F0; color: #334155; }
.badge-easy { background: #DBEAFE; color: #1E40AF; }
.badge-hard { background: #EDE9FE; color: #5B21B6; }
.badge-moderate { background: #FFEDD5; color: #9A3412; }

.session, .calf, .club, .meta, .your-note { padding: 0 12px; }

.session p, .club p, .calf p, .week-note { margin: 0; }

.your-note {

.guide-wrap { max-width: 40rem; margin: 0 auto; padding: 8px 16px 48px; }

.read-how {

  padding: 10px 12px; color: #1E3A8A;
}
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.toc a {
  text-decoration: none; color: var(--primary); background: #fff;
  border: 1px solid #DDD6FE; border-radius: 999px; padding: 6px 10px;
  font-size: 0.75rem; font-weight: 700;
}
.zone, .week-blurb {
  background: #fff; border-radius: 12px; padding: 10px 12px; margin: 0 0 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.week-blurb.is-this-week { box-shadow: 0 0 0 2px #3B82F6; }

.zone p, .week-blurb p { margin: 0.25rem 0 0; }
.guide-wrap ol { padding-left: 1.2rem; }

.sign-out { margin-left: auto; background: none; border: none; color: #fff; font-weight: 800; cursor: pointer; min-height: 40px; }

<body>
  <main id="gate" class="gate"></main>
  <div id="app" hidden></div>
  <script>
const TOKEN_KEY = 'eabha-session';
const SITE = 'https://running-schedule-puce.vercel.app';
const gate = document.getElementById('gate');
const app = document.getElementById('app');
let who = 'eabha';

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function savedToken() {
  const local = localStorage.getItem(TOKEN_KEY);
  if (local) return local;
  const older = sessionStorage.getItem(TOKEN_KEY);
  if (!older) return '';
  localStorage.setItem(TOKEN_KEY, older);
  sessionStorage.removeItem(TOKEN_KEY);
  return older;
}
function storeToken(value) {
  if (value) localStorage.setItem(TOKEN_KEY, value);
  else localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(TOKEN_KEY);
}
function showNotice() {
  app.hidden = true;
  app.innerHTML = '';
  gate.hidden = false;
  gate.innerHTML = '<div class="gate-card"><h1>Sign in</h1><p>This copy has no sign-in. Open <a href="' + SITE + '">the training site</a>.</p></div>';
}
function showPasscode(message) {
  app.hidden = true;
  app.innerHTML = '';
  gate.hidden = false;
  document.title = 'Sign in';
  gate.innerHTML =
    '<form class="gate-card" id="gateForm">' +
    '<h1>Sign in</h1>' +
    '<p>Enter a passcode to open the training pages.</p>' +
    '<div class="gate-choices">' +
    '<button type="button" data-who="eabha" aria-pressed="true">Eabha</button>' +
    '<button type="button" data-who="niall" aria-pressed="false">Niall</button>' +
    '</div>' +

const KEY = 'eabha-allireland-2026';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function daysUntil(iso) {

}

}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function applyState() {
  document.querySelectorAll('.day').forEach(day => {
    const id = day.dataset.date;

  document.querySelectorAll('#guide .week-blurb').forEach(el => el.classList.remove('is-this-week'));

  if (window.eabhaAfterRender) window.eabhaAfterRender();
}

function weekIndexOfToday() {
  const el = document.querySelector('.day[data-date="' + TODAY + '"]');
  if (!el) return -1;
  return weeks.indexOf(el.closest('.week'));
}

function renderNote(day) {
  const id = day.dataset.date;
  const box = day.querySelector('.your-note');
  const note = state.notes[id];
  const logBtn = day.querySelector('.log-btn');
  if (!note) {
    box.hidden = true;
    logBtn.textContent = 'Log';
    return;
  }
  box.hidden = false;
  box.querySelector('.your-note-text').textContent = note.text;
  const t = new Date(note.timestamp);
  box.querySelector('.your-note-time').textContent = 'Logged ' + t.getDate() + ' ' + MONTHS[t.getMonth()] + ' ' +
    String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');

function refreshProgress() {
  let allDone = 0, allTotal = 0;
  weeks.forEach((week, i) => {
    const days = [...week.querySelectorAll('.day')];
    const done = days.filter(d => d.classList.contains('is-done')).length;
    allDone += done;
    allTotal += days.length;
    const bar = week.querySelector('.bar span');
    const count = week.querySelector('.week-count');
    const complete = week.querySelector('.week-complete');
    if (bar) bar.style.width = (days.length ? Math.round(done / days.length * 100) : 0) + '%';
    if (count) count.textContent = done + ' of ' + days.length + ' days marked done';
    if (complete) complete.hidden = done !== days.length;

    if (chip) chip.classList.toggle('has-today', i === weekIndexOfToday());
  });

  overall.textContent = allDone + ' / ' + allTotal + ' DAYS DONE (' + pct + '%)';
}

function countdownText() {
  const marks = [...document.querySelectorAll('.day[data-effort="Race"]')].map(day => {
    const session = day.querySelector('.session p');
    const name = session ? session.textContent.split('.')[0] : day.dataset.label;
    return { iso: day.dataset.date, name, when: day.dataset.label };
  });
  const el = document.getElementById('countdown');
  const next = marks.map(m => ({ ...m, days: daysUntil(m.iso) })).find(m => m.days >= 0);
  if (!next) { el.hidden = true; return; }
  el.hidden = false;
  if (next.days === 0) el.textContent = next.name + ' is today · ' + next.when;
  else if (next.days === 1) el.textContent = next.name + ' is tomorrow · ' + next.when;
  else el.textContent = next.name + ' in ' + next.days + ' days · ' + next.when;
}

  document.getElementById('weekPhase').textContent = week.dataset.phase;
  document.getElementById('prevWeek').disabled = weekIndex === 0;
  document.getElementById('nextWeek').disabled = weekIndex === weeks.length - 1;
  document.querySelectorAll('.chip').forEach(chip => {
    const on = Number(chip.dataset.week) === weekIndex;
    chip.classList.toggle('is-on', on);
    chip.setAttribute('aria-current', on ? 'true' : 'false');

  const todayBtn = document.getElementById('todayBtn');
  const card = document.querySelector('.day.today');

    todayBtn.hidden = true;
  } else {
    todayBtn.hidden = false;
    const bits = ['Today', card.dataset.label, card.dataset.effort];
    if (card.dataset.verdict) bits.push(card.dataset.verdict);
    todayBtn.textContent = bits.join(' · ');

  document.getElementById('guideBtn').textContent = guideOn ? 'Schedule' : 'Guide';
  document.getElementById('guideBtn').setAttribute('aria-expanded', guideOn ? 'true' : 'false');
  document.body.classList.toggle('guide-open', guideOn);
  refreshProgress();
}

function showWeek(i, scrollMode, behavior) {
  if (i < 0 || i >= weeks.length) return;

  document.getElementById('guide').hidden = true;
  document.getElementById('schedule').hidden = false;

  weeks.forEach((w, n) => {
    w.classList.toggle('is-on', n === i);
    const fold = w.querySelector('.week-fold');
    if (fold && n === i) fold.open = true;
  });
  updateChrome();
  syncStickyPad();
  const how = behavior || (window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');
  const run = () => {
    if (scrollMode === 'top') weeks[i].scrollIntoView({ block: 'start', behavior: how });
    if (scrollMode === 'today') {
      const el = document.getElementById('focus-card') || document.querySelector('.day.today');
      if (el) el.scrollIntoView({ block: 'start', behavior: how });
    }
  };
  if (how === 'auto') requestAnimationFrame(() => requestAnimationFrame(run));
  else run();
}

function openGuide() {
  guideOn = true;
  document.getElementById('schedule').hidden = true;
  document.getElementById('guide').hidden = false;
  updateChrome();
  requestAnimationFrame(() => {
    syncStickyPad();
    window.scrollTo({ top: 0, behavior: 'auto' });
  });
}

function goToday(behavior) {
  const i = weekIndexOfToday();
  const firstDay = document.querySelector('.day');
  if (i < 0) { showWeek(firstDay && daysUntil(firstDay.dataset.date) > 0 ? 0 : weeks.length - 1, 'top', behavior || 'auto'); return; }
  showWeek(i, 'today', behavior || 'auto');
}

function openNoteModal(date) {
  editingDate = date;
  const day = document.querySelector('.day[data-date="' + date + '"]');
  document.getElementById('noteTitle').textContent = 'Note · ' + day.dataset.label;
  document.getElementById('noteSub').textContent = 'Saved on this phone. The plan for the day stays on the card.';
  document.getElementById('noteText').value = state.notes[date] ? state.notes[date].text : '';
  document.getElementById('noteModal').classList.add('open');
  document.body.classList.add('modal-open');
  setTimeout(() => document.getElementById('noteText').focus(), 50);
}
function closeNoteModal() {
  document.getElementById('noteModal').classList.remove('open');
  document.body.classList.remove('modal-open');
  editingDate = null;
}
function openLog() {
  const list = document.getElementById('logList');
  const entries = Object.keys(state.notes).sort();
  if (!entries.length) {
    list.innerHTML = '<p class="log-empty">No notes yet. Use Log on a day to record what you did.</p>';
  } else {
    list.innerHTML = '<ul class="log-list">' + entries.map(date => {
      const day = document.querySelector('.day[data-date="' + date + '"]');
      const label = day ? day.dataset.label : date;
      return '<li><button type="button" class="linkish" data-jump="' + date + '">' + esc(label) + '</button><p>' +
        esc(state.notes[date].text) + '</p></li>';
    }).join('') + '</ul>';
  }
  document.getElementById('logModal').classList.add('open');
  document.body.classList.add('modal-open');
}
function closeLog() {
  document.getElementById('logModal').classList.remove('open');
  if (!document.getElementById('noteModal').classList.contains('open')) document.body.classList.remove('modal-open');
}

document.body.addEventListener('click', e => {
  const done = e.target.closest('.done-btn');
  if (done) {
    const id = done.dataset.date;
    if (window.eabhaOnDone && window.eabhaOnDone(id)) return;
    if (state.done[id]) delete state.done[id]; else state.done[id] = true;
    save(); applyState(); refreshProgress();
    return;
  }
  const log = e.target.closest('.log-btn');
  if (log) {
    if (window.eabhaOnLog && window.eabhaOnLog(log.dataset.date)) return;
    openNoteModal(log.dataset.date);
    return;
  }
  const clear = e.target.closest('.note-clear');
  if (clear) {
    const day = clear.closest('.day');
    if (!confirm('Clear the note for ' + day.dataset.label + '?')) return;
    delete state.notes[day.dataset.date];
    save(); renderNote(day);
    return;
  }
  const jump = e.target.closest('[data-jump]');
  if (jump) {
    closeLog();
    const day = document.querySelector('.day[data-date="' + jump.dataset.jump + '"]');
    if (!day) return;
    const i = weeks.indexOf(day.closest('.week'));
    showWeek(i, 'none');
    day.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
});

document.getElementById('prevWeek').addEventListener('click', () => showWeek(weekIndex - 1, 'top'));
document.getElementById('nextWeek').addEventListener('click', () => showWeek(weekIndex + 1, 'top'));
document.getElementById('todayBtn').addEventListener('click', () => goToday('smooth'));
document.getElementById('guideBtn').addEventListener('click', () => { if (guideOn) goToday('smooth'); else openGuide(); });
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => showWeek(Number(chip.dataset.week), 'top'));
});
document.getElementById('openGuide').addEventListener('click', openGuide);
document.getElementById('openLog').addEventListener('click', openLog);
document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirm('Clear all done ticks and notes on this phone?')) return;
  state = { done: {}, notes: {} };
  save(); applyState(); refreshProgress();
});
document.getElementById('noteSave').addEventListener('click', () => {
  if (!editingDate) return;
  const text = document.getElementById('noteText').value.trim();
  if (!text) { document.getElementById('noteText').focus(); return; }
  state.notes[editingDate] = { text, timestamp: Date.now() };
  state.done[editingDate] = true;
  save();
  const day = document.querySelector('.day[data-date="' + editingDate + '"]');
  closeNoteModal();
  applyState(); refreshProgress();
  if (day) day.scrollIntoView({ block: 'start', behavior: 'smooth' });
});
document.getElementById('noteCancel').addEventListener('click', closeNoteModal);
document.getElementById('logClose').addEventListener('click', closeLog);
document.getElementById('noteModal').addEventListener('click', e => { if (e.target.id === 'noteModal') closeNoteModal(); });
document.getElementById('logModal').addEventListener('click', e => { if (e.target.id === 'logModal') closeLog(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeNoteModal(); closeLog(); return; }
  if (e.target.closest('textarea, input, button')) return;
  if (guideOn) return;
  if (e.key === 'ArrowLeft') showWeek(weekIndex - 1, 'top');
  if (e.key === 'ArrowRight') showWeek(weekIndex + 1, 'top');
});

let touchX = 0, touchY = 0, touchOk = false;
document.addEventListener('touchstart', e => {
  touchOk = !e.target.closest('button, a, textarea, input, .week-chips, .modal-overlay');
  if (!touchOk) return;
  touchX = e.changedTouches[0].screenX;
  touchY = e.changedTouches[0].screenY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touchOk || guideOn) return;
  const dx = touchX - e.changedTouches[0].screenX;
  const dy = Math.abs(touchY - e.changedTouches[0].screenY);
  if (Math.abs(dx) > 70 && Math.abs(dx) > dy * 1.8) {
    if (dx > 0) showWeek(weekIndex + 1, 'top');
    else showWeek(weekIndex - 1, 'top');
  }
}, { passive: true });

window.eabhaRefresh = refreshProgress;
window.addEventListener('resize', syncStickyPad);
function headlineFrom(text) {
  const full = text.replace(/\s+/g, ' ').trim();
  const limit = 92;
  if (full.length <= limit) return full.replace(/\.$/, '');
  const firstStop = full.search(/\.(\s|$)/);
  if (firstStop >= 48 && firstStop <= limit) return full.slice(0, firstStop);
  const minAt = full.lastIndexOf(' min', limit);
  if (minAt >= 24) return full.slice(0, minAt + 4);
  const slice = full.slice(0, limit);
  let best = -1;
  ['. ', ', '].forEach(mark => {
    const at = slice.lastIndexOf(mark);
    if (at >= 24 && at > best) best = at;
  });
  if (best >= 24) return full.slice(0, best).replace(/[.:]$/, '');
  const space = slice.lastIndexOf(' ');
  return full.slice(0, space > 24 ? space : limit).replace(/[,:;]$/, '') + '…';
}
function setupCompactDay(day) {
  const session = day.querySelector('.session p');
  if (!session || day.querySelector('.headline')) return;
  const headline = document.createElement('p');
  headline.className = 'headline';
  headline.textContent = headlineFrom(session.textContent);
  day.querySelector('.badges').after(headline);
  const detail = document.createElement('div');
  detail.className = 'day-detail';
  detail.hidden = true;
  const duration = day.querySelector('.duration');
  if (duration) detail.append(duration);
  ['.session', '.club', '.meta', '.calf'].forEach(sel => {
    const el = day.querySelector(sel);
    if (el) detail.append(el);
  });
  const actions = day.querySelector('.day-actions');
  headline.after(actions);
  actions.after(detail);
  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.setAttribute('aria-hidden', 'true');
  chevron.innerHTML = '<svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  day.querySelector('.day-head').append(chevron);
  day.setAttribute('aria-expanded', 'false');
  function toggleDetail() {
    const open = detail.hidden;
    detail.hidden = !open;
    day.classList.toggle('is-open', open);
    day.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  day.addEventListener('click', event => {
    if (event.target.closest('button, a, input, textarea, select, label')) return;
    toggleDetail();
  });
  day._openDetail = function () {
    if (detail.hidden) toggleDetail();
  };
}
function compactSchedule() {
  document.querySelectorAll('.week').forEach(week => {
    const intro = week.querySelector('.week-intro');
    const fold = document.createElement('details');
    fold.className = 'week-fold';
    fold.open = !!week.querySelector('.day.today');
    const summary = document.createElement('summary');
    summary.className = 'week-summary';
    ['h2', '.phase', '.km-line'].forEach(sel => {
      const el = intro.querySelector(sel);
      if (el) summary.append(el);
    });
    fold.append(summary);
    const weekNote = intro.querySelector('.week-note');
    if (weekNote) {
      const more = document.createElement('details');
      more.className = 'week-more';
      const moreSummary = document.createElement('summary');
      moreSummary.textContent = 'About this week';
      more.append(moreSummary, weekNote);
      fold.append(more);
    }
    [...intro.children].forEach(child => fold.append(child));
    [...week.querySelectorAll(':scope > .day')].forEach(day => fold.append(day));
    intro.remove();
    week.append(fold);
  });
  if (!document.querySelector('.week-fold[open]')) {
    const folds = [...document.querySelectorAll('.week-fold')];
    const last = folds[folds.length - 1];
    const lastDay = document.querySelector('.week:last-child .day:last-child');
    (lastDay && TODAY > lastDay.dataset.date ? last : folds[0]).open = true;
  }
  document.querySelectorAll('.day').forEach(setupCompactDay);
  const focusDay = document.querySelector('.day.today')
    || [...document.querySelectorAll('.day')].find(day => day.dataset.date > TODAY)
    || document.querySelector('.week:last-child .day:last-child');
  if (!focusDay) return;
  const focus = document.createElement('article');
  focus.id = 'focus-card';
  focus.className = 'focus-card';
  const kicker = document.createElement('p');
  kicker.className = 'k';
  kicker.textContent = focusDay.classList.contains('today') ? 'Today' : (focusDay.dataset.date > TODAY ? 'Next' : 'Last day');
  const title = document.createElement('h2');
  title.textContent = focusDay.dataset.label;
  const badges = focusDay.querySelector('.badges').cloneNode(true);
  badges.querySelectorAll('[hidden]').forEach(el => el.remove());
  const line = document.createElement('p');
  line.className = 'headline';
  line.textContent = focusDay.querySelector('.headline').textContent;
  const open = document.createElement('button');
  open.type = 'button';
  open.className = 'focus-open';
  open.textContent = 'Show this day';
  open.addEventListener('click', () => {
    const fold = focusDay.closest('.week-fold');
    if (fold) fold.open = true;
    if (focusDay._openDetail) focusDay._openDetail();
    focusDay.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  focus.append(kicker, title, badges, line, open);
  document.getElementById('schedule').prepend(focus);
}
load();
applyState();
countdownText();
compactSchedule();
goToday('auto');

  
};
